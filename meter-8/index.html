<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c32">
  <meta name="description" content="Ingrediënten en allergenen van de producten bij Meter 8.">
  <title>DKW Meter 8 | Kosher Product Informatie</title>
  <link rel="stylesheet" href="../assets/css/styles.css?v=uniform-ruimte-1">
  <link rel="stylesheet" href="../assets/css/catalog-responsive.css?v=mobile-three-2">
  <link rel="stylesheet" href="../assets/css/product-print.css?v=20260926-final">
</head>
<body>
  <header class="site-header compact">
    <a class="brand" href="../" aria-label="Terug naar de startpagina">
      <span class="brand-mark" aria-hidden="true">K</span>
      <span>Kosher Product Informatie</span>
    </a>
  </header>

  <main class="catalog-main">
    <nav class="breadcrumb" aria-label="Kruimelpad"><a href="../">Start</a><span aria-hidden="true">/</span><span>Meter 8</span></nav>
    <section class="catalog-intro">
      <p class="eyebrow">Schapmeter 8</p>
      <h1>DKW Meter 8</h1>
      <p>Bekijk hier de ingrediënten en allergenen van deze producten, in het Nederlands.</p>
    </section>

    <section class="catalog-tools" aria-label="Producten zoeken en filteren">
      <label class="search-box">
        <span class="sr-only">Zoek een product of merk</span>
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="Zoek product of merk…">
      </label>
      <div class="filters" role="group" aria-label="Filter op productsoort">
        <button class="filter active" type="button" data-filter="Alle" aria-pressed="true">Alle</button>
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </section>

    <section id="product-grid" class="product-grid" aria-label="Producten"></section>
    <div id="empty-state" class="empty-state" hidden>
      <strong id="empty-title">Nog geen producten toegevoegd</strong>
      <p id="empty-copy">Meter 8 staat klaar voor de echte productgegevens.</p>
    </div>
  </main>

  <footer class="site-footer" data-site-disclaimer></footer>

  <dialog id="product-dialog" class="product-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Sluiten">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <script src="./products.js?v=shelf-order-52"></script>
  <script src="../assets/js/ingredient-allergens.js?v=1"></script>
  <script src="./catalog.js?v=allergens-uniform-1"></script>
  <script src="../meter-6/image-fit.js?v=1"></script>
  <script src="../assets/js/product-print.js?v=20260926-final"></script>
</body>
</html>
