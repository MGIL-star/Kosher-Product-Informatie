<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c32">
  <meta name="description" content="Ingrediënten en allergenen van de producten bij Meter 14.">
  <title>DKW Meter 14 | Kosher Product Informatie</title>
  <link rel="stylesheet" href="../assets/css/styles.css?v=uniform-ruimte-1">
  <link rel="stylesheet" href="../meter-3/meter-3.css">
  <link rel="stylesheet" href="../assets/css/catalog-responsive.css">
  <link rel="stylesheet" href="./../meter-6/meter-6.css?v=uniform-ruimte-1">
  <link rel="stylesheet" href="./photos.css?v=shared-layout-6">
</head>
<body>
  <header class="site-header compact">
    <a class="brand" href="../" aria-label="Terug naar de startpagina">
      <span class="brand-mark" aria-hidden="true">K</span>
      <span>Kosher Product Informatie</span>
    </a>
  </header>

  <main class="catalog-main">
    <nav class="breadcrumb" aria-label="Kruimelpad"><a href="../">Start</a><span aria-hidden="true">/</span><span>Meter 14</span></nav>
    <section class="catalog-intro">
      <p class="eyebrow">Schapmeter 14</p>
      <h1>DKW Meter 14</h1>
      <p>Bekijk hier de Nederlandse ingrediënten en allergenen van deze producten.</p>
    </section>

    <section class="catalog-tools" aria-label="Producten zoeken en filteren">
      <label class="search-box">
        <span class="sr-only">Zoek een product of merk</span>
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="Zoek product of merk…">
      </label>
      <div class="filters" role="group" aria-label="Filter op productsoort"><button class="filter active" type="button" data-filter="Alle" aria-pressed="true">Alle</button><button class="filter" type="button" data-filter="Bissli" aria-pressed="false">Bissli</button><button class="filter" type="button" data-filter="Bamba" aria-pressed="false">Bamba</button><button class="filter" type="button" data-filter="Apropo" aria-pressed="false">Apropo</button><button class="filter" type="button" data-filter="Hamama" aria-pressed="false">Hamama</button></div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </section>

    <section id="product-grid" class="product-grid" aria-label="Producten"></section>
    <div id="empty-state" class="empty-state" hidden>
      <strong id="empty-title">Nog geen producten toegevoegd</strong>
      <p id="empty-copy">Meter 14 staat klaar voor de echte productgegevens.</p>
    </div>
  </main>

  <footer class="site-footer" data-site-disclaimer></footer>

  <dialog id="product-dialog" class="product-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Sluiten">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <script src="./products.js?v=approved-25"></script>
  <script src="./catalog.js?v=bamba-equal-size-4"></script>
  <script src="./image-fit.js?v=visible-crop-4"></script>
</body>
</html>
