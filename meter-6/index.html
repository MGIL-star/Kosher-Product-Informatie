  <header class="site-header compact">

      <span class="brand-mark" aria-hidden="true">K</span>
      <span>Kosher Product Informatie</span>

  <main class="catalog-main">
    <nav class="breadcrumb" aria-label="Kruimelpad"><a href="../">Start</a><span aria-hidden="true">/</span><span>Meter 6</span></nav>
    <section class="catalog-intro">
      <nav class="catalog-languages notranslate" translate="no" dir="ltr" aria-label="Taal kiezen"></nav>
      <p class="eyebrow">Schapmeter 6</p>
      <h1>DKW Meter 6</h1>
      <p>Bekijk hier de ingrediënten en allergenen van deze producten, in het Nederlands.</p>
    </section>

    <section class="catalog-tools" aria-label="Producten zoeken en filteren">
      <label class="search-box">
        <span class="sr-only">Zoek een product of merk</span>
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="Zoek product of merk…">
      </label>
      <div class="filters" role="group" aria-label="Filter op productsoort">
        <button class="filter active" type="button" data-filter="Alle" aria-pressed="true">Alle</button>

        <button class="filter" type="button" data-filter="Thee" aria-pressed="false">Thee</button>
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </section>

    <section id="product-grid" class="product-grid" aria-label="Producten"></section>
    <div id="empty-state" class="empty-state" hidden>
      <strong id="empty-title">Nog geen producten toegevoegd</strong>
      <p id="empty-copy">Meter 6 staat klaar voor de echte productgegevens.</p>
    </div>
  </main>

  <footer class="site-footer" data-site-disclaimer></footer>

  <dialog id="product-dialog" class="product-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Sluiten">×</button>
    <div id="dialog-content"></div>
  </dialog>
